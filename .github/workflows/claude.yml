name: Claude

# Mention @claude in an issue, PR comment or review to have Claude Code work on it.
# Only the repo owner can trigger it: the repo is public, and every run costs tokens.
#
# Setup, once: install the Claude GitHub App (https://github.com/apps/claude) on this repo,
# then add the secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, uses your Claude subscription).
# To pay per use instead, add ANTHROPIC_API_KEY and swap the input below.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # So Claude can run the same checks as CI before it pushes.
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(./gradlew test*),Bash(./gradlew ktlintCheck*),Bash(./gradlew ktlintFormat*),Bash(./gradlew buildPlugin*),Bash(./gradlew -p sample-app assembleDebug*)"
