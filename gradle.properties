pluginGroup = io.github.daranna.sqlitebrowser
pluginVersion = 0.2.0

# Android Studio to build against: the oldest one the plugin supports (sinceBuild in build.gradle.kts).
# verifyPlugin also checks the latest. Releases: https://jb.gg/android-studio-releases-list.xml
androidStudioVersion = 2025.3.1.7
latestAndroidStudioVersion = 2026.2.2.8

# Uncomment to use your installed Android Studio instead of downloading one (faster, no 1.2 GB download).
# Better: put this line in ~/.gradle/gradle.properties so it stays out of git.
# localStudioPath = /Applications/Android Studio.app

# Compiling against all of Android Studio needs more than Gradle's default heap.
org.gradle.jvmargs = -Xmx3g
kotlin.daemon.jvmargs = -Xmx2g

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
